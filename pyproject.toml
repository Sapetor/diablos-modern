# Packaging + tooling configuration for DiaBloS Modern.
#
# The `[project]` table below is the single source of truth for the version:
# `modern_ui/__init__.py` parses it back out of this file (or, in a frozen
# build, out of the `_version.txt` the spec emits), and `diablos.spec` /
# `tools/build.sh` parse it so the macOS bundle version and the DMG filename
# always match the release tag.
#
# Distribution to end users is PyInstaller (`diablos.spec`, `tools/build.sh`)
# and DiaBloS is run from a checkout in development (`python diablos_modern.py`).
# It is an *application*, not a library: its top-level directories are `lib/`,
# `blocks/` and `config/`, names far too generic to drop into site-packages, so
# this project deliberately installs no importable packages at all (see
# `[tool.setuptools]` below). The pip metadata exists purely to carry one
# canonical version string that `modern_ui/__init__.py`, `diablos.spec`,
# `tools/build.sh` and the release workflow all read back.

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diablos-modern"
version = "1.0.0"
description = "Simulink-style block diagram simulation tool built with Python and PyQt5"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "DiaBloS Development Team" }]
keywords = ["simulation", "block-diagram", "control-systems", "pyqt5", "simulink"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# Mirrors requirements.txt. Upper bounds guard reproducibility against
# breaking major releases of the numerically-sensitive core.
dependencies = [
    "numpy>=1.20.0,<3.0",
    "matplotlib>=3.3.0",
    "tqdm>=4.60.0",
    "pyqtgraph>=0.12.0",
    "PyQt5>=5.15.0,<5.16",
    "scipy>=1.6.0,<2.0",
    "Pillow>=8.0.0",
]

[project.optional-dependencies]
# Mirrors requirements-dev.txt.
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
    "ruff==0.15.18",  # pinned: matches .github/workflows/ci.yml (formatter output shifts between releases)
    "mypy>=1.0.0",
    "PyQt5-stubs>=5.15.0",
]

# Optional: symbolic features (LaTeX/MathML export, `lib/engine/symbolic_engine.py`
# and the per-block `symbolic_execute` hooks). Everything degrades gracefully
# when SymPy is absent; `diablos.spec` bundles it only if the build env has it.
symbolic = ["sympy>=1.9"]

[project.urls]
Homepage = "https://github.com/Sapetor/diablos-modern"
Repository = "https://github.com/Sapetor/diablos-modern"

[tool.setuptools]
# Deliberately install NOTHING importable.
#
# `lib/`, `blocks/` and `config/` are top-level directories in this repo. The
# previous `include = ["lib*", "modern_ui*", "blocks*", "config*"]` meant
# `pip install .` dropped packages literally named `lib`, `blocks` and `config`
# into site-packages, where they shadow anything else with those names for every
# other project in the same environment. Renaming them is out of scope (they are
# referenced by absolute import from ~500 places, saved diagrams and the spec),
# so the project is simply not shipped as a wheel of top-level packages:
# `pip install .` now installs only the distribution metadata (the canonical
# version string), and `pip install -e .` likewise leaves the checkout as the
# only import root. Run the app from the checkout (`python diablos_modern.py`)
# or install a PyInstaller build; there is no `diablos` console script, because
# a console script would import packages that are not installed.
packages = []
py-modules = []

[tool.ruff]
# 3.9 is the supported baseline (CI matrix + readthedocs); do not let Ruff
# suggest 3.10+-only rewrites.
target-version = "py39"
line-length = 100
extend-exclude = ["build", "dist", "archive", ".venv", ".venv-win"]

[tool.ruff.lint]
# Keep Ruff's default, high-signal rule set (E4 imports, E7 statements,
# E9 syntax errors, F pyflakes — unused imports/vars, undefined names) and
# silence the remaining *stylistic* E7xx checks that flag working code
# (numpy comparisons, math-y single-letter names) rather than bugs. The
# 2026-07 repo-wide `ruff format` pass retired E701/E702 (compound
# statements) — the formatter now guarantees them, and `ruff format --check`
# is enforced in CI.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # module-import-not-at-top — many intentional lazy/conditional imports
    "E712",  # comparison to True/False — unsafe to auto-rewrite on numpy arrays
    "E721",  # type(x) == T comparisons
    "E731",  # lambda assignment
    "E741",  # ambiguous variable name (l/I/O) — common in math/control code
]

[tool.ruff.lint.per-file-ignores]
# Unused locals (F841) are tolerated in non-shipped scripts: test bodies often
# bind a result only to document intent, and auto-deleting the binding can drop
# a side-effecting call. Enforced strictly in shipped code (lib/, modern_ui/,
# blocks/).
"tests/**" = ["F841"]
"examples/**" = ["F841"]
# Maintenance / verification scripts under scripts/ are not shipped either —
# several are throwaway harnesses that bind an intermediate result to name it.
"scripts/**" = ["F841"]
# Work-in-progress benchmark that references an unbuilt DSim(...) mock; it is a
# standalone script (moved out of tests/ in 2026-09), not a pytest module.
"scripts/benchmark_fast_solver.py" = ["F821", "F841"]
