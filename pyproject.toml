# Packaging + tooling configuration for DiaBloS Modern.
#
# The `[project]` table below is the single source of truth for the version:
# `diablos/gui/__init__.py` parses it back out of this file (or, in a frozen
# build, out of the `_version.txt` the spec emits; installed, out of the
# distribution metadata), and `diablos.spec` / `tools/build.sh` parse it so the
# macOS bundle version and the DMG filename always match the release tag.
#
# DiaBloS installs as one package, `diablos` (src/diablos):
#   pip install diablos-modern          the engine + scripting API (numpy, scipy)
#   pip install 'diablos-modern[gui]'   plus the application (`diablos` command)
# Until 2026-11 the code lived in top-level `lib/`, `blocks/`, `modern_ui/`
# packages and nothing was installable; `diablos.compat` maps those old names
# for user blocks (automatically) and old scripts (opt-in).
#
# The data folders `config/`, `locales/`, `examples/`, `licenses/` stay at the
# repository root (one canonical copy, used directly by a checkout); setup.py
# copies them into the wheel as `diablos/resources/`, which is where
# `diablos.core.app_paths.resource_path` looks in an installed package.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diablos-modern"
version = "1.1.0"
description = "Simulink-style block diagram simulation tool built with Python and PyQt6"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "DiaBloS Development Team" }]
keywords = ["simulation", "block-diagram", "control-systems", "pyqt6", "simulink"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# The engine needs only numpy and scipy (tests/regression/
# test_engine_without_pyqt6.py::test_engine_needs_only_numpy_and_scipy).
# Bounds are explained in requirements.txt, which lists everything (core + gui).
dependencies = [
    "numpy>=1.20.0,<3.0",
    "scipy>=1.6.0,<2.0",
]

[project.optional-dependencies]
# The application: window, live plots, figures, progress bar, GIF export.
gui = [
    "PyQt6>=6.7",
    "pyqtgraph>=0.13.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.60.0",
    "Pillow>=8.0.0",
]
# Mirrors requirements-dev.txt.
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
    "sympy>=1.9",  # tests exercise the optional symbolic engine
    "ruff==0.16.8",  # pinned: matches .github/workflows/ci.yml (formatter output shifts between releases)
    "mypy>=1.0.0",
    # No Qt stubs entry: PyQt6 ships its own .pyi files (PyQt5-stubs was a
    # third-party stopgap for PyQt5 and has no PyQt6 successor).
]

# Optional: symbolic features (LaTeX/MathML export, `src/diablos/core/engine/symbolic_engine.py`
# and the per-block `symbolic_execute` hooks). Everything degrades gracefully
# when SymPy is absent; `diablos.spec` bundles it only if the build env has it.
symbolic = ["sympy>=1.9"]

[project.urls]
Homepage = "https://github.com/Sapetor/diablos-modern"
Repository = "https://github.com/Sapetor/diablos-modern"

[project.scripts]
# Headless subcommands (run, export-python, diff, self-test) work without the
# gui extra; bare `diablos` opens the application and needs it.
diablos = "diablos.main:entry"

[tool.setuptools.packages.find]
where = ["src"]
include = ["diablos*"]

[tool.setuptools.package-data]
# GUI icons ship inside the package; the root data folders are copied in by
# setup.py (see the header).
"diablos.gui" = ["icons/*.svg"]

[tool.ruff]
# 3.10 is the supported baseline (requires-python, CI matrix); do not let Ruff
# suggest 3.11+-only rewrites.
target-version = "py310"
line-length = 100
# `*.md` keeps the formatter on Python files only. Ruff 0.16 started formatting
# Python code blocks embedded in Markdown; here that only rewrites documentation
# samples (collapsing the aligned trailing comments in CLAUDE.md / AGENTS.md that
# are deliberate) without touching a line of shipped code. Drop this entry if the
# docs samples should ever be formatter-governed too.
extend-exclude = ["build", "dist", "archive", ".venv", ".venv-win", "*.md"]

[tool.ruff.lint]
# Keep Ruff's default, high-signal rule set (E4 imports, E7 statements,
# E9 syntax errors, F pyflakes — unused imports/vars, undefined names) and
# silence the remaining *stylistic* E7xx checks that flag working code
# (numpy comparisons, math-y single-letter names) rather than bugs. The
# 2026-07 repo-wide `ruff format` pass retired E701/E702 (compound
# statements) — the formatter now guarantees them, and `ruff format --check`
# is enforced in CI.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # module-import-not-at-top — many intentional lazy/conditional imports
    "E712",  # comparison to True/False — unsafe to auto-rewrite on numpy arrays
    "E721",  # type(x) == T comparisons
    "E731",  # lambda assignment
    "E741",  # ambiguous variable name (l/I/O) — common in math/control code
]

[tool.ruff.lint.per-file-ignores]
# Unused locals (F841) are tolerated in non-shipped scripts: test bodies often
# bind a result only to document intent, and auto-deleting the binding can drop
# a side-effecting call. Enforced strictly in shipped code (lib/, modern_ui/,
# blocks/).
"tests/**" = ["F841"]
"examples/**" = ["F841"]
# Maintenance / verification scripts under scripts/ are not shipped either —
# several are throwaway harnesses that bind an intermediate result to name it.
"scripts/**" = ["F841"]
# Work-in-progress benchmark that references an unbuilt DSim(...) mock; it is a
# standalone script (moved out of tests/ in 2026-09), not a pytest module.
"scripts/benchmark_fast_solver.py" = ["F821", "F841"]
