# File: .readthedocs.yaml

version: 2

build:
  os: "ubuntu-20.04"
  tools:
    python: "3.9"

# Build with MkDocs (the project's maintained doc system: mkdocs.yml, Material theme)
mkdocs:
  configuration: mkdocs.yml

# Explicitly set the version of Python and its requirements
python:
  install:
    - requirements: docs/requirements.txt

formats:
  - pdf
