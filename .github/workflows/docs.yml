name: Docs

# Builds the MkDocs site with --strict on every push and pull request, so a
# broken link or a page missing from the nav fails the branch. On main the same
# build is published to GitHub Pages via `mkdocs gh-deploy`, which commits the
# rendered site to the gh-pages branch — the site therefore works whether or not
# the Read the Docs project (readthedocs.yaml) is configured.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# gh-deploy pushes the rendered site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # gh-deploy needs the full history of the gh-pages branch to add a
          # commit to it rather than rewrite it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Matches readthedocs.yaml and the newer leg of the CI matrix.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # mkdocstrings imports lib/, blocks/ and modern_ui/ for the API reference,
      # which pulls in PyQt6.
      - name: Install Qt runtime system libraries
        uses: ./.github/actions/qt-apt-deps

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build site
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: mkdocs build --strict

      # Only main publishes. Pull requests stop at the strict build above.
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
