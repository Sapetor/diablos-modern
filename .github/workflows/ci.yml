name: CI

on:
  push:
    # Every branch, not just main: a feature branch should go red before it is
    # merged. A `branches` filter with no `tags` filter never matches a tag
    # push, which is deliberate — release.yml runs this same workflow on the
    # tag through `workflow_call`, so a tag would otherwise build it twice.
    branches: ["**"]
  pull_request:
  # Reusable: .github/workflows/release.yml gates the release on a green run
  # of this exact workflow (`jobs.tests.uses: ./.github/workflows/ci.yml`).
  workflow_call:

# Cancel in-progress runs for the same ref when a new commit is pushed.
# `github.workflow` is part of the key because when release.yml calls this
# workflow it resolves to the *caller* ("Release"): without it a direct CI run
# and a release's CI run on the same ref would share a group and cancel each
# other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned: `ruff format --check` output can shift between formatter
        # style releases; bump the pin together with a repo-wide reformat.
        run: pip install ruff==0.15.18

      - name: Lint
        # Config (rule selection, ignores, py39 target) lives in pyproject.toml.
        run: ruff check .

      - name: Format check
        # The repo was fully `ruff format`-ed in 2026-07; keep it that way.
        run: ruff format --check .

      - name: Block registry in sync
        # lib/block_loader._BLOCK_MODULES is what the frozen build ships. A new
        # block file that nobody synced works in dev and is silently missing
        # from the packaged app, so fail the branch instead.
        run: python tools/sync_block_registry.py --check

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Hard cap so a wedged test can never burn hours of CI time.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.9 matches the local/readthedocs environment; 3.12 is forward-looking.
        python-version: ["3.9", "3.12"]

    env:
      # PyQt5 widgets are constructed in tests (see tests/conftest.py).
      # Run Qt headless and keep matplotlib off any GUI backend.
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Qt runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        # --timeout makes an unexpected hang fail fast (signal method can
        # interrupt blocking C calls); the job timeout-minutes is the hard cap.
        # Coverage is reported (term-missing) but not gated on a threshold.
        # --junitxml gives a machine-readable per-test record, uploaded below so
        # a failure can be inspected without scrolling the raw job log.
        run: >-
          pytest tests/
          --timeout=120 --timeout-method=signal
          --cov=lib --cov=blocks --cov=modern_ui --cov-report=term-missing
          --junitxml=junit/test-results-${{ matrix.python-version }}.xml

      - name: Upload JUnit test report
        # Uploaded even when the suite fails — that is when it is most useful.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml
          if-no-files-found: warn
