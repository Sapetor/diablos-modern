name: CI

on:
  push:
    # Every branch, not just main: a feature branch should go red before it is
    # merged. A `branches` filter with no `tags` filter never matches a tag
    # push, which is deliberate — release.yml runs this same workflow on the
    # tag through `workflow_call`, so a tag would otherwise build it twice.
    branches: ["**"]
  pull_request:
  # Reusable: .github/workflows/release.yml gates the release on a green run
  # of this exact workflow (`jobs.tests.uses: ./.github/workflows/ci.yml`).
  workflow_call:

# Cancel in-progress runs for the same ref when a new commit is pushed.
# `github.workflow` is part of the key because when release.yml calls this
# workflow it resolves to the *caller* ("Release"): without it a direct CI run
# and a release's CI run on the same ref would share a group and cancel each
# other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned: `ruff format --check` output can shift between formatter
        # style releases; bump the pin together with a repo-wide reformat.
        run: pip install ruff==0.16.8

      - name: Lint
        # Config (rule selection, ignores, py310 target) lives in pyproject.toml.
        run: ruff check .

      - name: Format check
        # The repo was fully `ruff format`-ed in 2026-07; keep it that way.
        run: ruff format --check .

      - name: Block registry in sync
        # diablos/core/block_loader._BLOCK_MODULES is what the frozen build ships. A new
        # block file that nobody synced works in dev and is silently missing
        # from the packaged app, so fail the branch instead.
        run: python tools/sync_block_registry.py --check

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Hard cap so a wedged test can never burn hours of CI time.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the supported baseline (pyproject requires-python); 3.12
        # matches readthedocs and is the forward-looking leg.
        python-version: ["3.10", "3.12"]

    env:
      # PyQt6 widgets are constructed in tests (see tests/conftest.py).
      # Run Qt headless and keep matplotlib off any GUI backend.
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Qt runtime system libraries
        uses: ./.github/actions/qt-apt-deps

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        # --timeout makes an unexpected hang fail fast (signal method can
        # interrupt blocking C calls); the job timeout-minutes is the hard cap.
        # Coverage is reported (term-missing) but not gated on a threshold.
        # --junitxml gives a machine-readable per-test record, uploaded below so
        # a failure can be inspected without scrolling the raw job log.
        run: >-
          pytest tests/
          --timeout=120 --timeout-method=signal
          --cov=diablos --cov-report=term-missing
          --junitxml=junit/test-results-${{ matrix.python-version }}.xml

      - name: Upload JUnit test report
        # Uploaded even when the suite fails — that is when it is most useful.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml
          if-no-files-found: warn

  package:
    # The pip package: build the sdist and a wheel from it, install the wheel
    # into a clean venv with no GUI libraries, and run it from outside the
    # checkout -- the scripting API, the `diablos` command and the headless
    # self-test (which also spawns Monte Carlo worker processes).
    name: Package (wheel, engine only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist-pkg .

      - name: Install the wheel without the gui extra
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install dist-pkg/*.whl
          /tmp/core/bin/pip list
          ! /tmp/core/bin/python -c "import PyQt6" 2>/dev/null
          ! /tmp/core/bin/python -c "import matplotlib" 2>/dev/null

      - name: Run it from outside the checkout
        working-directory: /tmp
        env:
          PYTHONPATH: ""
        run: |
          /tmp/core/bin/python -c "
          from diablos.api import load
          from diablos.core.app_paths import resource_path, checkout_root
          assert checkout_root() is None
          r = load(resource_path('examples/first_order_step_response.diablos')).run(t=2.0)
          v = round(float(r['output'][-1]), 4)
          assert v == 0.3935, v
          print('api ok', r.engine, v)
          "
          /tmp/core/bin/diablos run "$(/tmp/core/bin/python -c "from diablos.core.app_paths import resource_path; print(resource_path('examples/pid_second_order.diablos'))")" -o /tmp/out.csv
          /tmp/core/bin/diablos self-test --no-gui
          /tmp/core/bin/diablos --version

  test-windows:
    # Windows-only regressions (native style, font metrics, cp1252 console,
    # registry-backed QSettings, filesystem ordering) slipped past the Linux
    # legs repeatedly in 2026-10, so run the suite natively on Windows too.
    name: Tests (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        # SIGALRM does not exist on Windows, so pytest-timeout uses threads.
        # No coverage here: the Linux legs report it.
        run: >-
          pytest tests/
          --timeout=120 --timeout-method=thread
          --junitxml=junit/test-results-windows.xml

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-windows
          path: junit/test-results-windows.xml
          if-no-files-found: warn
